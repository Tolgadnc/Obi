[project]
name = "obi"
version = "0.1.0"
description = "Unofficial belt-by-belt guide to the Judo Vlaanderen kyu syllabus, with videos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.scripts]
obi = "obi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
