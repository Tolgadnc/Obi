# Interface text. Every key needs both nl and en; a template asking for a missing key fails the build.

site.tagline:
  nl: Wat je moet kennen voor elke judogordel, met video's.
  en: What to know for each judo belt, with videos.
site.description:
  nl: >-
    Onofficiële gids bij het kyu-programma van Judo Vlaanderen: per gordel de technieken die je
    moet kennen, met video's.
  en: >-
    Unofficial guide to the Judo Vlaanderen kyu syllabus: the techniques for each belt, with videos.

