# Every technique, kata part and training form that belts.yaml refers to.
#
#   id               URL-safe name; used in belts.yaml and in page addresses
#   name             Japanese name in the Groeimodel's spelling (deviations: SOURCE_NOTES.md)
#   kanji            optional
#   category         ukemi | nage-waza | katame-waza | kata | oefenvormen
#   group            nage-waza:   te-waza | koshi-waza | ashi-waza | ma-sutemi-waza | yoko-sutemi-waza
#                    katame-waza: osaekomi-waza | shime-waza | kansetsu-waza
#                    (other categories have no group)
#   translation      our own wording, in nl and en
#   description      training forms (oefenvormen) only: one line in nl and en
#   videos           the first approved video is the primary one; at most 3 approved
#     youtube        the 11-character video id, in quotes
#     title, channel as YouTube shows them
#     start, end     optional, in seconds
#     approved       true once checked; unapproved videos are never shown
#   no_video_reason  when no suitable video exists; the page then says "no video available"

